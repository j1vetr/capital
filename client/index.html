  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; padding: 0; background-color: #0f172a; font-family: 'Montserrat', sans-serif; }
        .initial-loader {
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: white;
        }
        .loader-logo {
          max-width: 250px;
          margin-bottom: 2rem;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .loader-logo img {
          width: 100%;
          height: auto;
          object-fit: contain;
          filter: brightness(0) invert(1);
        }
        .loader-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          border-top-color: #38aae1;
          animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .7; }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-logo">
          <img src="/logo.webp" alt="Capital Lashing Logo" />
        </div>
        <div class="loader-spinner"></div>
        <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">
          Capital Lashing & Port Services - Profesyonel Yük Sabitleme ve Liman Hizmetleri
        </h1>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
